# 参考 frontend/nginx.conf；通过 localhost 访问后端服务。
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 600s;

    # ^~ 防止文件扩展名缓存规则截获 API、媒体或报告请求。
    location ^~ /api/ {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        proxy_pass http://localhost:8000;
    }

    location ^~ /ws/ {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /app-automation-templates/ {
        proxy_pass http://localhost:8000;
    }
    location ^~ /app-automation-reports/ {
        alias /app/media/app-automation/allure-reports/;
    }

    # DEBUG=False 时 Django 不提供 media/static，由同容器 Nginx 读取。
    location ^~ /media/ {
        alias /app/media/;
    }
    location ^~ /static/ {
        alias /app/static_files/;
        expires 7d;
    }
    location ^~ /static_files/ {
        alias /app/static_files/;
        expires 7d;
    }

    # Vite 文件名带哈希的构建资源可长期缓存。
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
